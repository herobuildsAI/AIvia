name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: node --check internal/app/web/app.js
      - run: node --test tests/ui.test.cjs
      - run: go build ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
